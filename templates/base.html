<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Portfolio" }}</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Page Specific CSS -->
    {% block page_css %}{% endblock %}
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="logo-section">
            <img src="{{ url_for('static', filename='images/logos/OFAAX40.jpg') }}" alt="Logo" class="logo">
            <h2 class="site-name">Anil Mandansuri</h2>
        </div>

        <nav class="nav">
            <!-- <a href="{{ url_for('home') }}">Home</a> -->
            <a href="{{ url_for('about') }}">About Me</a>
            <a href="{{ url_for('motion_graphic') }}">Motion Graphic</a>
            <a href="{{ url_for('logo_design') }}">Logo Design</a>
            <a href="{{ url_for('graphic_work') }}">Graphic Work</a>
            <a href="{{ url_for('film') }}">Film</a>
        </nav>
    </header>

    <!-- SCROLLABLE CONTENT -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        &copy; 2026 Anil Mandansuri Portfolio
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
